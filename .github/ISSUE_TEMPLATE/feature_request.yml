name: Feature request
description: Suggest a new rule, protected zone, format, command or improvement.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.

        **Do not paste a private manuscript.** Describe the pattern with a short,
        redacted example instead. For a rule proposal, a before/after sentence is
        usually enough.

        textscope is a deterministic word/phrase rewriter, not a paraphraser.
        Requests that need a language model to understand the text are unlikely
        to be accepted for the default path, but an optional backend may be.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or missing today? Include a short example if you can.
      placeholder: |
        The Turkish table leaves "söz konusu" untouched, so formal paragraphs
        still read like a translation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should textscope do? If this is a rule, give the source and replacement.
      placeholder: |
        Add a phrase swap: ("söz konusu", "bu") — checked that it does not
        change the word count or collide with an existing key.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or rules you tried that did not fit.
    validations:
      required: false
  - type: dropdown
    id: language
    attributes:
      label: Which language does this concern?
      description: Rule data is language-specific; pick the table the change belongs to.
      options:
        - "en (English)"
        - "tr (Turkish)"
        - "Both"
        - "Not language-specific"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this?
      description: |
        Rule data lives in `rules_en.py` / `rules_tr.py`; behaviour lives in the
        rewriter. Protected zones and formats need code plus tests.
      options:
        - "New or changed rule data"
        - "Code change (rewriter, CLI, formats, protected zones)"
        - "Documentation"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, papers, detector behaviour, or examples from other tools.
    validations:
      required: false
